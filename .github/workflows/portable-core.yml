name: Portable core
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore exact data and test no-overwrite behavior
        run: |
          python -m unittest discover -s pathtraced/tests -v
          python tools/restore_original_film.py
          python pathtraced/tools/restore_native_cache.py
      - name: Install native CAD and renderer dependencies
        run: python -m pip install -r requirements.txt
      - name: Evaluate real CAD and fresh reconstructed dynamics
        run: |
          python tools/smoke_cad.py
          node source/capture.mjs
          python source/inspect_capture.py
      - name: Build, test and render with the host compiler
        run: python pathtraced/tools/build_native.py --check --smoke
